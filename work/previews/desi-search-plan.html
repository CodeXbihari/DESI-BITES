const $=s=>root.querySelector(s);let cart={};let query='pizza';
function card(item){const id=sample.indexOf(item),qty=cart[id]||0;return `<article class="db-food"><div class="db-photo"><img src="${photos[item[2]]}" alt="${item[2]}"><span class="db-veg" role="img" aria-label="Vegetarian"></span></div><div class="db-food-body"><div class="db-food-name">${item[0]}</div><div class="db-food-bottom"><span class="db-price">₹${item[1]}</span>${qty?`<div class="db-step"><button class="cursor-interaction" data-id="${id}" data-delta="-1" aria-label="Remove one ${item[0]}">−</button><span>${qty}</span><button class="cursor-interaction" data-id="${id}" data-delta="1" aria-label="Add one ${item[0]}">+</button></div>`:`<button class="db-add cursor-interaction" data-id="${id}" data-delta="1">Add <span>+</span></button>`}</div></div></article>`}
function view(which){for(const name of ['home','search','cart-view'])$('#db-'+name).hidden=name!==which;}
function render(){const q=query.trim().toLowerCase();const matches=q?sample.filter(x=>x[0].toLowerCase().includes(q)):[];$('#db-heading').replaceChildren();if(q){$('#db-heading').append('Showing results for “');const b=document.createElement('strong');b.textContent=query;$('#db-heading').append(b,'”');}else $('#db-heading').textContent='Search the Desi Bites menu';$('#db-clear').hidden=!q;$('#db-results').innerHTML=matches.map(card).join('');$('#db-empty').hidden=matches.length>0;$('#db-empty').textContent=q?'No matching dishes. Try another food name.':'Type a food name to find matching dishes.';$('#db-popular').innerHTML=[sample[0],sample[10]].map(card).join('');$('#db-recommended').innerHTML=[sample[2],sample[12]].map(card).join('');const count=Object.values(cart).reduce((a,b)=>a+b,0);const total=Object.entries(cart).reduce((a,[id,n])=>a+sample[id][1]*n,0);$('#db-count').hidden=count===0;$('#db-count').textContent=count;$('#db-summary').textContent=count?`${count} items · ₹${total}　 View Cart →`:'';$('#db-cart-items').innerHTML=count?Object.entries(cart).map(([id,n])=>`<div class="db-cart-row"><span>${sample[id][0]} × ${n}</span><strong>₹${sample[id][1]*n}</strong></div>`).join('')+`<div class="db-cart-row"><strong>Subtotal</strong><strong>₹${total}</strong></div>`:'Your cart is empty.';}
$('#db-query').addEventListener('input',e=>{query=e.target.value;render();});
function clear(){query='';$('#db-query').value='';render();$('#db-query').focus();}
$('#db-x').onclick=clear;$('#db-clear').onclick=clear;$('#db-back').onclick=()=>view('home');$('#db-open').onclick=()=>{view('search');$('#db-query').focus();};$('#db-cart').onclick=()=>view('cart-view');$('#db-cart-back').onclick=()=>view('search');root.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const id=b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+Number(b.dataset.delta));if(!cart[id])delete cart[id];render();});render();
