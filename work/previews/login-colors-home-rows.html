  const byId=id=>items.find(item=>item.id===id);
  const popular=items.slice(0,6),recommended=items.slice(6);
  const $=selector=>root.querySelector(selector);
  const quantities={};
  let query='paneer';
  function card(item){const qty=quantities[item.id]||0;return `<article class="lh-card"><div class="lh-photo"><img src="${item.photo}" alt="${item.name}"><span class="lh-veg" role="img" aria-label="Vegetarian"></span></div><div class="lh-body"><div class="lh-name">${item.name}</div><div class="lh-card-bottom"><span class="lh-price">₹${item.price}</span>${qty?`<div class="lh-step"><button class="cursor-interaction" data-id="${item.id}" data-delta="-1" aria-label="Remove one ${item.name}">−</button><span>${qty}</span><button class="cursor-interaction" data-id="${item.id}" data-delta="1" aria-label="Add one ${item.name}">+</button></div>`:`<button class="lh-add cursor-interaction" data-id="${item.id}" data-delta="1">Add ＋</button>`}</div></div></article>`;}
  function render(){
    $('#lh-popular').innerHTML=popular.map(card).join('');
    $('#lh-recommended').innerHTML=recommended.map(card).join('');
    const q=query.trim().toLowerCase();
    const matches=q?items.filter(item=>item.name.toLowerCase().includes(q)):[];
    const heading=$('#lh-heading');heading.replaceChildren();
    if(q){heading.append('Showing results for “');const b=document.createElement('strong');b.textContent=query.trim();heading.append(b,'”');}else heading.textContent='Search the Desi Bites menu';
    $('#lh-results').innerHTML=matches.length?matches.map(card).join(''):'<div class="lh-empty">'+(q?'No matching dishes. Try another food name.':'Type a food name to start searching.')+'</div>';
    const count=Object.values(quantities).reduce((a,b)=>a+b,0);
    const total=Object.entries(quantities).reduce((a,[id,n])=>a+byId(id).price*n,0);
    $('#lh-cart').hidden=!count;$('#lh-cart').textContent=count+' items · ₹'+total+'　View Cart →';
  }
  root.addEventListener('click',event=>{const button=event.target.closest('button[data-id]');if(!button)return;const id=button.dataset.id;quantities[id]=Math.max(0,(quantities[id]||0)+Number(button.dataset.delta));const offsets=[$('#lh-popular').scrollLeft,$('#lh-recommended').scrollLeft];render();$('#lh-popular').scrollLeft=offsets[0];$('#lh-recommended').scrollLeft=offsets[1];});
  $('#lh-open-search').onclick=()=>{$('#lh-home').hidden=true;$('#lh-search-page').hidden=false;};
  $('#lh-back').onclick=()=>{$('#lh-search-page').hidden=true;$('#lh-home').hidden=false;};
  $('#lh-query').oninput=event=>{query=event.target.value;render();};
  $('#lh-clear').onclick=()=>{query='';$('#lh-query').value='';render();};
  render();
})();
